<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Liste des inscrits</title>
  <link rel="stylesheet" href="accueil.css">
</head>
<body>

  <div style="max-width: 700px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; font-family: Arial, sans-serif;">

      <h1 id="bienvenueUser" style="margin: 0; color: #26352d;">Bienvenue sur notre plateforme</h1>

    <p style="color: #555;">Découvrez les membres inscrits.</p>
